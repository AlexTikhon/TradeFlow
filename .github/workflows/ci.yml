name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tradeflow
          POSTGRES_PASSWORD: tradeflow
          POSTGRES_DB: tradeflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tradeflow -d tradeflow_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgresql://tradeflow:tradeflow@localhost:5432/tradeflow_test

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Real authenticated S3 API + PostgreSQL, failure compensation and paired recovery rehearsal.
  # The suite owns both loopback-only containers, credentials, databases and cleanup.
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:storage

  # Chromium smoke suite on its own runner and Postgres server. Global setup (e2e/support)
  # creates the `_e2e` database, builds and starts the API and web app, and releases all of it
  # at the end, pass or fail. No retries: playwright.config.ts sets `retries: 0`.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tradeflow
          POSTGRES_PASSWORD: tradeflow
          # Only the maintenance database: the run creates and drops tradeflow_e2e itself.
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tradeflow -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      E2E_DATABASE_URL: postgresql://tradeflow:tradeflow@localhost:5432/tradeflow_e2e

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The Chromium build pinned by e2e's @playwright/test, and the system libraries it needs.
      - run: pnpm --filter @tradeflow/e2e exec playwright install --with-deps chromium

      - id: e2e
        run: pnpm test:e2e

      # Server logs, failure screenshots, the HTML report and results/.last-run.json, whenever the
      # suite itself failed. Traces, videos and storage state are off (playwright.config.ts), and
      # nothing in e2e/.output records headers or cookies; the exclusions below keep it so if
      # that ever changes.
      #
      # e2e/.output is itself hidden, and upload-artifact skips hidden paths unless told
      # otherwise, even one named explicitly: without include-hidden-files nothing was uploaded.
      # It applies only to this one path. A run that failed without leaving diagnostics fails
      # this step instead of passing it silently.
      - if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics
          path: |
            e2e/.output/
            !e2e/.output/**/*.storage-state.json
            !e2e/.output/**/.auth/**
            !e2e/.output/**/*.har
            !e2e/.output/**/trace.zip
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  # The fresh-voyage walkthrough (docs/demo.md, walkthrough 2) on a demo started by the same code
  # as `pnpm demo`: built apps, all migrations, the real seed, production sign-in admission. No
  # database service: the demo starts its own PostgreSQL 18 container on the runner's Docker
  # daemon, on a loopback port Docker picks, and removes it, its temporary directory and its
  # servers at the end, pass or fail. No retries: demo/playwright.config.ts sets `retries: 0`.
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The Chromium build pinned by e2e's @playwright/test, and the system libraries it needs.
      - run: pnpm --filter @tradeflow/e2e exec playwright install --with-deps chromium

      - id: demo
        run: pnpm demo:verify

      # The walkthrough's failure screenshot, error context and results/.last-run.json, whenever
      # the walkthrough itself failed. Traces, videos and storage state are off
      # (demo/playwright.config.ts); the exclusions below keep it so if that ever changes. The
      # server logs live in the run's temporary directory and are removed with it; a failing
      # startup step or a server exiting on its own prints their last lines to the job log.
      - if: failure() && steps.demo.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: demo-diagnostics
          path: |
            e2e/.output/demo/
            !e2e/.output/demo/**/*.storage-state.json
            !e2e/.output/demo/**/.auth/**
            !e2e/.output/demo/**/*.har
            !e2e/.output/demo/**/trace.zip
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
